# Netlify Configuration
# For more information: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "dist"
  command = "npm run build"

# Netlify Functions live in netlify/functions/ (this is Netlify's default,
# stated explicitly for clarity).
[functions]
  directory = "netlify/functions"

# QA-only: expose the qa-status function at the clean path /qa-status so
# Prerender sees a normal-looking page URL. Must be declared BEFORE the
# SPA catch-all below, otherwise /* swallows it. status = 200 is a Netlify
# rewrite (proxy), which preserves the upstream function's actual status
# code (200 or 500) — it does NOT force a 200 response.
[[redirects]]
  from = "/qa-status"
  to = "/.netlify/functions/qa-status"
  status = 200

# QA-only: expose the qa-301 function at the clean path /qa-301. Same
# rewrite-proxy mechanism as /qa-status above (status = 200 is the
# rewrite TYPE, not a forced response code) — it preserves the
# function's actual 301 status code AND its Location header. Must
# remain BEFORE the SPA catch-all below.
[[redirects]]
  from = "/qa-301"
  to = "/.netlify/functions/qa-301"
  status = 200

# QA-only: expose the qa-403 function at the clean path /qa-403. Same
# rewrite-proxy mechanism as the QA endpoints above (status = 200 is
# the rewrite TYPE, not a forced response code) — it preserves the
# function's actual 403 status and its text/html Content-Type. Must
# remain BEFORE the SPA catch-all below.
[[redirects]]
  from = "/qa-403"
  to = "/.netlify/functions/qa-403"
  status = 200

# QA-only: additional fixed-status endpoints handled by a single
# parameterized function (netlify/functions/qa-code.ts). The function
# inspects the public path it was hit at (req.url in v2 reflects the
# original /qa-NNN, not the internal /.netlify/functions/qa-code) and
# emits the matching status. Same rewrite-proxy mechanism as the QA
# endpoints above — status = 200 is the rewrite TYPE, not a forced
# response code, so Netlify preserves the function's real status code
# and headers (Location for 3xx, Content-Type for 4xx HTML).
# All MUST remain BEFORE the SPA catch-all below.
[[redirects]]
  from = "/qa-302"
  to = "/.netlify/functions/qa-code"
  status = 200

[[redirects]]
  from = "/qa-303"
  to = "/.netlify/functions/qa-code"
  status = 200

[[redirects]]
  from = "/qa-307"
  to = "/.netlify/functions/qa-code"
  status = 200

[[redirects]]
  from = "/qa-308"
  to = "/.netlify/functions/qa-code"
  status = 200

[[redirects]]
  from = "/qa-401"
  to = "/.netlify/functions/qa-code"
  status = 200

[[redirects]]
  from = "/qa-404"
  to = "/.netlify/functions/qa-code"
  status = 200

[[redirects]]
  from = "/qa-429"
  to = "/.netlify/functions/qa-code"
  status = 200

# Redirect all requests to /index.html for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Serve admin page for Decap CMS
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
