# Netlify Configuration
# For more information: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "dist"
  command = "npm run build"

# Netlify Functions live in netlify/functions/ (this is Netlify's default,
# stated explicitly for clarity).
[functions]
  directory = "netlify/functions"

# QA-only: expose the qa-status function at the clean path /qa-status so
# Prerender sees a normal-looking page URL. Must be declared BEFORE the
# SPA catch-all below, otherwise /* swallows it. status = 200 is a Netlify
# rewrite (proxy), which preserves the upstream function's actual status
# code (200 or 500) — it does NOT force a 200 response.
[[redirects]]
  from = "/qa-status"
  to = "/.netlify/functions/qa-status"
  status = 200

# Redirect all requests to /index.html for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Serve admin page for Decap CMS
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
